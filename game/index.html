<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Ladle Bistro — a rush-hour cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Self-test output, only used with ?selftest=1. */
  #testout { position: absolute; left: 0; top: 0; color: #fff; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Golden Ladle Bistro: take orders, grill patties, chop vegetables, stack the plate and ring the bell to serve"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="testout"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
